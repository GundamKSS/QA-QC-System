<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QCheck Wireframe ขาวดำ</title>
<!--
  QCheck — Wireframe ขาวดำ (low-fidelity) สำหรับ Workshop Phase 0 / WBS 0.4
  ไฟล์เดียว ไม่มี dependency ภายนอก · ไม่มีธีม/สี/แบรนด์ — ใช้ยืนยัน flow เท่านั้น
  อ้างอิงสเปก: docs/02-spec-functional.md §4, §5 · docs/03-spec-business-rules-data.md BR-02..06, BR-11, BR-12
-->
<style>
:root{
  --ink:#111;--g1:#333;--g2:#555;--g3:#888;--g4:#bbb;--g5:#ddd;--g6:#ececec;--g7:#f6f6f6;--paper:#fff;
  --font:-apple-system,"Sukhumvit Set","Thonburi","Leelawadee UI","Tahoma","Noto Sans Thai",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#e4e4e4;color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 6px;line-height:1.3}
h2{font-size:18px}h3{font-size:15px;margin-top:14px}
p{margin:4px 0 8px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.muted{color:var(--g2)}.small{font-size:12px}.xs{font-size:11px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}
.grow{flex:1;min-width:0}.mt{margin-top:10px}.mb{margin-bottom:10px}.center{text-align:center}

/* ---------- Workshop shell (อยู่นอกตัวแอป) ---------- */
.shell{display:flex;height:100dvh}
.nav{width:290px;flex:none;background:#fff;border-right:1px solid var(--g4);overflow:auto;padding:14px 14px 40px}
.nav h1{font-size:16px}
.nav .grp{margin:14px 0 4px;font-size:11px;letter-spacing:.04em;color:var(--g2);font-weight:700;text-transform:uppercase}
.nav .scr{display:flex;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;padding:7px 8px;border-radius:6px;cursor:pointer}
.nav .scr:hover{border-color:var(--g4)}
.nav .scr.on{background:var(--ink);color:#fff}
.nav .scr code{font-family:inherit;font-weight:700;min-width:30px}
.nav ol{padding-left:18px;margin:4px 0}.nav li{margin:6px 0}
.nav .task{border:1px solid var(--g4);background:#fff;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px;margin-left:4px}
.nav label.opt{display:flex;align-items:center;gap:8px;margin:6px 0}
.nav select{border:1px solid var(--g3);border-radius:4px;padding:2px 4px;background:#fff}
.disclaimer{border:2px dashed var(--ink);padding:8px;border-radius:6px;font-size:12px;margin:10px 0}
.stage{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:20px 16px}
.wfbar{display:none}

/* ---------- Spec notes (ปิดได้) ---------- */
.note{border:1px dashed var(--g2);background:var(--g7);border-radius:6px;padding:6px 8px;font-size:11.5px;color:var(--g1);margin:10px 0;line-height:1.45}
.note::before{content:"หมายเหตุสเปก · ";font-weight:700}
body.nonotes .note{display:none}

/* ---------- Mobile frame ---------- */
.phone{position:relative;width:var(--pw,375px);height:min(812px,calc(100dvh - 40px));background:var(--paper);border:2px solid var(--ink);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;filter:grayscale(1);flex:none}
.ph-status{height:24px;flex:none;font-size:11px;display:flex;justify-content:space-between;align-items:center;padding:2px 18px 0;color:var(--g2)}
.ph-status .wm{letter-spacing:.2em;font-weight:700;color:var(--g3)}
.ph-appbar{min-height:54px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px;border-bottom:1px solid var(--g4)}
.ph-appbar .t{flex:1;min-width:0}
.ph-appbar .t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-appbar .t small{display:block;color:var(--g2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-body{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
.ph-foot{flex:none;border-top:1px solid var(--g4);padding:10px 12px 12px;background:var(--paper)}
.tabbar{flex:none;display:flex;border-top:1px solid var(--g4)}
.tabbar button{flex:1;min-height:56px;border:0;background:none;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--g2)}
.tabbar button .ic{width:22px;height:22px;border:1.5px solid currentColor;border-radius:5px}
.tabbar button.on{color:var(--ink);font-weight:700}
.tabbar button.on .ic{background:var(--ink)}
.iconbtn{min-width:44px;height:44px;border:0;background:none;display:grid;place-items:center;font-size:20px;cursor:pointer;border-radius:8px;padding:0 6px}
.iconbtn.txt{font-size:13px;border:1.5px solid var(--g3);height:36px}
.sync{font-size:12px;color:var(--g2);white-space:nowrap}

/* ---------- Controls ---------- */
.btn{min-height:44px;padding:0 14px;border:1.5px solid var(--ink);background:#fff;border-radius:8px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.25}
.btn.pri{background:var(--ink);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn.lg{min-height:64px;font-size:18px}
.btn.ghost{border-color:var(--g4)}
.btn.is-disabled,.btn:disabled{border-color:var(--g4);color:var(--g3);background:var(--g7);cursor:not-allowed}
.btn.sel{background:var(--ink);color:#fff;box-shadow:inset 0 0 0 2px #fff}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.navrow{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:40px;border:0;border-right:1px solid var(--ink);background:#fff;cursor:pointer;font-size:13px;padding:0 6px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff;font-weight:700}
.field{margin-bottom:12px}
.field>label,.flabel{display:block;font-size:12px;color:var(--g1);margin-bottom:4px;font-weight:600}
.req::after{content:" *"}
.inp{width:100%;min-height:44px;border:1.5px solid var(--g3);border-radius:8px;padding:8px 10px;background:#fff;font-size:16px}
.inp.err{border-color:var(--ink);border-width:2.5px}
.inp[readonly],.ro{background:var(--g7);border-style:dashed;color:var(--g1)}
.inrow{display:flex;gap:8px}.inrow .inp{flex:1;min-width:0}
.msg{font-size:12px;margin-top:4px}
.msg.bad{font-weight:700}
.msg.bad::before{content:"✕ "}

/* ---------- Content blocks ---------- */
.card{border:1.5px solid var(--g3);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.card.strong{border:2px solid var(--ink)}
.card.dash{border-style:dashed}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.kv dt{color:var(--g2)}.kv dd{margin:0}
.tag{display:inline-block;border:1px solid var(--g2);border-radius:4px;padding:0 6px;font-size:11px;line-height:18px;color:var(--g1);white-space:nowrap;background:#fff;vertical-align:middle}
.tag.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag.dash{border-style:dashed}
.bar{height:8px;border:1px solid var(--g2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g2)}
.segs{display:flex;gap:2px;margin:6px 0 10px}
.segs i{flex:1;height:10px;border:1px solid var(--g3);background:#fff}
.segs i.ok{background:var(--g3)}
.segs i.fail{background:repeating-linear-gradient(45deg,var(--ink) 0 2px,#fff 2px 4px);border-color:var(--ink)}
.segs i.cur{outline:2px solid var(--ink);outline-offset:1px}
.ph-img{display:grid;place-items:center;border:1px solid var(--g4);background-color:var(--g7);color:var(--g2);font-size:12px;text-align:center;
  background-image:linear-gradient(to top right,transparent calc(50% - .6px),var(--g4) 50%,transparent calc(50% + .6px)),linear-gradient(to top left,transparent calc(50% - .6px),var(--g4) 50%,transparent calc(50% + .6px))}
.ph-img span{background:var(--g7);padding:2px 6px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.thumb{position:relative;width:72px;height:72px;font-size:8px;line-height:1.2;align-content:end;padding:2px;place-items:end start}
.thumb .wmk{background:rgba(255,255,255,.85);padding:1px 2px;text-align:left}
.thumb .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;font-size:12px;cursor:pointer;display:grid;place-items:center;padding:0}
.thumb.vid::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:20px;color:var(--g1)}
.alert{border:2px solid var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0;background:#fff}
.alert::before{content:"! ";font-weight:800}
.alert.soft{border-width:1px;border-style:dashed}
.alert.soft::before{content:"i  "}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--ink);border-radius:16px;padding:3px 10px;font-size:13px;background:#fff}
.result{border:3px solid var(--ink);border-radius:10px;padding:12px;text-align:center;margin-bottom:10px}
.result .big{font-size:26px;font-weight:800;line-height:1.2}
.result.np{background:repeating-linear-gradient(45deg,#fff 0 8px,var(--g6) 8px 10px)}
.choice{display:block;width:100%;text-align:left;border:1.5px solid var(--g3);border-radius:10px;padding:10px 12px;background:#fff;margin-bottom:8px;cursor:pointer;min-height:56px}
.choice.on{border:3px solid var(--ink)}
.choice.off{color:var(--g3);border-style:dashed;cursor:not-allowed}
.choice .r{display:inline-block;width:18px;height:18px;border:2px solid var(--ink);border-radius:50%;vertical-align:-3px;margin-right:6px}
.choice.on .r{background:radial-gradient(var(--ink) 45%,#fff 50%)}
.hist{background:var(--g7);border:1px dashed var(--g3);border-radius:8px;padding:8px;margin:8px 0}
.lines>div{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--g5)}
.lines>div:last-child{border-bottom:0}
details>summary{cursor:pointer;font-weight:700;padding:8px 0}

/* ---------- Overlays inside device ---------- */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#fff;width:100%;max-height:88%;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
.sheet .grab{width:40px;height:4px;background:var(--g4);border-radius:2px;margin:8px auto 4px;flex:none}
.sheet .sh-head{padding:4px 14px 8px;border-bottom:1px solid var(--g5);flex:none}
.sheet .sh-body{overflow:auto;padding:0 14px;flex:1}
.sheet .sh-foot{padding:10px 14px 14px;border-top:1px solid var(--g5);display:grid;grid-template-columns:1fr 1.6fr;gap:10px;flex:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border:0;border-bottom:1px solid var(--g5);background:none;text-align:left;padding:8px 2px;cursor:pointer}
.opt .cb{width:24px;height:24px;border:2px solid var(--ink);border-radius:5px;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px}
.opt.on .cb{background:var(--ink);color:#fff}
.opt .nm{font-size:15px}
.cam{position:absolute;inset:0;background:#1d1d1d;color:#fff;z-index:30;display:flex;flex-direction:column}
.cam .top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:13px}
.cam .vf{flex:1;margin:0 12px;border:1px dashed #888;border-radius:8px;display:grid;place-items:center;color:#aaa;text-align:center;font-size:13px;position:relative}
.cam .vf .target{width:70%;height:30%;border:2px solid #ddd;border-radius:6px}
.cam .strip{display:flex;gap:6px;padding:8px 12px;min-height:88px;overflow-x:auto}
.cam .strip .thumb{flex:none}
.cam .ctrl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 16px 18px}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:#9a9a9a;cursor:pointer}
.shutter.rec{border-radius:16px;background:#ddd}
.cam .btn{background:transparent;color:#fff;border-color:#fff}
.cam .btn.pri{background:#fff;color:#111}
.drawer .opt .cb{border-radius:50%;font-size:12px}
.toast{position:absolute;left:12px;right:12px;top:84px;pointer-events:none;background:var(--ink);color:#fff;padding:10px 12px;border-radius:8px;z-index:50;font-size:13px;box-shadow:0 2px 0 #000}
.laptop .toast{left:auto;top:auto;right:24px;bottom:24px;width:440px}

/* ---------- Laptop frame ---------- */
.lap-wrap{position:relative;flex:none}
.laptop{position:absolute;top:0;left:0;width:1366px;height:768px;background:#fff;border:2px solid var(--ink);transform-origin:0 0;display:flex;filter:grayscale(1);overflow:hidden}
.lap-side{width:224px;flex:none;border-right:1px solid var(--g4);background:var(--g7);display:flex;flex-direction:column}
.lap-side .logo{height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--g4);font-weight:800}
.lap-side .logo .lg{width:30px;height:30px;font-size:8px}
.lap-side button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:10px 18px;cursor:pointer;font-size:14px}
.lap-side button.on{background:var(--ink);color:#fff;font-weight:700}
.lap-side button .xs{color:var(--g3)}
.lap-main{flex:1;display:flex;flex-direction:column;min-width:0}
.lap-head{height:56px;flex:none;border-bottom:1px solid var(--g4);display:flex;align-items:center;gap:14px;padding:0 24px}
.lap-head .search{width:360px;border:1.5px solid var(--g3);border-radius:8px;padding:6px 10px;color:var(--g3)}
.lap-body{flex:1;overflow:auto;padding:18px 24px 28px}
.lap-body .inp{min-height:38px;font-size:14px;padding:6px 10px;border-radius:6px}
.filters{display:flex;gap:10px;align-items:end;margin:12px 0;flex-wrap:wrap}
.filters .field{margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--g5);padding:8px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--g6);font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:1}
.tbl th button{border:0;background:none;font-weight:700;cursor:pointer;padding:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--g7)}
.tbl tr.hl td{background:var(--g6);box-shadow:inset 0 2px 0 var(--ink),inset 0 -2px 0 var(--ink)}
.tbl .num{text-align:right;white-space:nowrap}
.tbl td:nth-child(1),.tbl td:nth-child(3),.tbl td:nth-child(9){white-space:nowrap}
.pg{display:inline-block;padding:0 6px;border:1.5px solid var(--ink);border-radius:4px;font-size:12px;white-space:nowrap}
.pg.ns{border-style:dashed;border-color:var(--g2)}
.pg.ip{background:linear-gradient(90deg,var(--g5) 50%,#fff 50%)}
.pg.ac{border-style:double;border-width:3px}
.pg.dn{background:var(--g4)}
.pg.ov{background:var(--ink);color:#fff}
.pg.un{border-width:3px;font-weight:700}
.s11{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
.fsec{border:1.5px solid var(--g3);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 16px}
.fgrid .span2{grid-column:span 2}.fgrid .span3{grid-column:span 3}
.calc{border:2px solid var(--ink);border-radius:10px;padding:14px 16px;position:sticky;top:0;background:#fff}
.calc .big{font-size:38px;font-weight:800;line-height:1.05}
.calc .blk{border-bottom:1px solid var(--g5);padding:10px 0}
.calc .blk:last-child{border-bottom:0}
.lap-foot{display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--g4);padding-top:14px;margin-top:4px}

/* ---------- Narrow screens: workshop users tapping on their own phone ---------- */
@media (max-width:700px){
  .shell{flex-direction:column}
  .wfbar{display:flex;align-items:center;justify-content:space-between;gap:8px;height:34px;flex:none;padding:0 10px;background:var(--ink);color:#fff;font-size:12px}
  .wfbar button{background:#fff;color:var(--ink);border:0;border-radius:4px;padding:3px 10px;font-weight:700;white-space:nowrap;flex:none}
  #wfTitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .nav{display:none;position:fixed;inset:34px 0 0 0;width:auto;z-index:100;border:0}
  body.navopen .nav{display:block}
  .stage{padding:0}
  .phone{width:100vw!important;height:calc(100dvh - 34px);border:0;border-radius:0}
}
/* ---------- S12–S14 ---------- */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--ink);margin:12px 0 14px}
.tabs button{border:1.5px solid var(--g3);border-bottom:0;background:var(--g7);padding:8px 16px;border-radius:8px 8px 0 0;cursor:pointer;font-weight:600;color:var(--g1)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.s12g{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}
.tbl.static tbody tr{cursor:default}
.tbl tr.sub td{background:var(--g7);border-bottom:2px solid var(--ink)}
.tbl input[type=checkbox]{width:18px;height:18px}
.tl>div{border-left:2px solid var(--ink);padding:0 0 12px 14px;margin-left:6px;position:relative}
.tl>div::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.tl>div.aqlk::before,.tl>div.corr::before{background:var(--ink)}
.chk{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.chk b{min-width:20px}
.delta{font-weight:700;white-space:nowrap}
.lock{border:2px solid var(--ink);background:repeating-linear-gradient(45deg,#fff 0 8px,var(--g6) 8px 10px);border-radius:8px;padding:8px 10px;margin:8px 0}
@media print{.nav,.wfbar{display:none}}
</style>

<body>
<div class="shell">
  <div class="wfbar"><span id="wfTitle">WIREFRAME</span><button type="button" data-act="toggleNav">หน้าจอ / ภารกิจ ☰</button></div>
  <nav class="nav" id="nav" aria-label="ตัวเลือกหน้าจอ wireframe"></nav>
  <main class="stage" id="stage"></main>
</div>
<script>
'use strict';
/* =====================================================================
   ข้อมูลตัวอย่าง + กฎคำนวณ (BR-02, BR-03, BR-04, BR-05, BR-11)
   ทุกชื่อ/เลข เป็นข้อมูลสมมติเพื่อใช้ใน workshop เท่านั้น
   ===================================================================== */
const TODAY = new Date(Date.UTC(2026, 9, 16)); // วันที่ของ wireframe = 16/10/2026
const NOW_TXT = '16/10/2026 10:42';
const QC_PCT = 10;                             // ⚙️ qc_percent
const DEADLINE_DAYS = 90;                      // ⚙️ invoice_qc_deadline_days

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const z2 = n => String(n).padStart(2, '0');
const fmtD = d => z2(d.getUTCDate()) + '/' + z2(d.getUTCMonth() + 1) + '/' + d.getUTCFullYear();
function parseD(s){
  const m = /^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*$/.exec(s || '');
  if(!m) return null;
  const d = new Date(Date.UTC(+m[3], +m[2] - 1, +m[1]));
  return d.getUTCDate() === +m[1] ? d : null;
}
const addDays = (d, n) => new Date(d.getTime() + n * 864e5);
const dayDiff = (a, b) => Math.round((b - a) / 864e5);
const norm = s => String(s || '').trim().replace(/\s+/g, ' ').toUpperCase(); // BR-01 normalize

/* BR-02: qc_required = min(lot, max(1, ceil(lot × 10%))) */
function qcRequired(lot){
  lot = Math.floor(+lot || 0);
  if(lot <= 0) return 0;
  return Math.min(lot, Math.max(1, Math.ceil(lot * QC_PCT / 100)));
}

/* BR-03: ตาราง AQL ตัวอย่าง = ISO 2859-1 General Inspection Level II (ค่าจริงรอ QA ส่ง ❓ C1)
   [lot_min, lot_max, code, ปกติ, ผ่อนคลาย, เคร่งครัด] */
const AQL_ROWS = [
  [2,8,'A',2,2,2],[9,15,'B',3,2,3],[16,25,'C',5,2,5],[26,50,'D',8,3,8],[51,90,'E',13,5,13],

  [1201,3200,'K',125,50,125],[3201,10000,'L',200,80,200],[10001,35000,'M',315,125,315]
];
const AQL_LV = {REDUCED:'ผ่อนคลาย', NORMAL:'ปกติ', TIGHTENED:'เคร่งครัด'};
function aqlLookup(level, lot){
  lot = Math.floor(+lot || 0);
  if(lot <= 0) return null;
  if(lot === 1) return {code:'A', n:1};
  const r = AQL_ROWS.find(r => lot >= r[0] && lot <= r[1]) || AQL_ROWS[AQL_ROWS.length - 1];
  const n = level === 'NORMAL' ? r[3] : level === 'REDUCED' ? r[4] : r[5];
  return {code:r[2], n:Math.min(n, lot)}; // qa_required = min(sample_size, lot)
}

function deadlineInfo(invDate, closed){
  const d = parseD(invDate);

function progressOf(p){
  const req = reqOf(p);
  if(p.st === 'CANCELLED') return {k:'', t:'(ไม่นับ)'};
  if(p.st === 'COMPLETED'){
    if(p.forced && p.qcDone < req) return {k:'un', t:'ตรวจขาด'};
    if(p.qcDone > req) return {k:'ov', t:'ตรวจเกิน'};
    return {k:'dn', t:'เสร็จ'};
  }
  if(p.st === 'QC_IN_PROGRESS' || (p.rw && p.st === 'QC_IN_PROGRESS')) return {k:'ip', t:'กำลังดำเนินการ'};
  if(p.qcDone === 0) return {k:'ns', t:'ยังไม่เริ่ม'};
  if(p.qcDone < req) return {k:'ip', t:'กำลังดำเนินการ'};
  return {k:'ac', t:'ตรวจครบ-รอปิด' + (p.rw ? ' (มี Rework)' : '')};
}

function needs(it, a){
  const fail = a.v === 'fail';
  const vidDef = fail && (a.defects || []).some(c => DEF[c].vid);
  return {photo:fail, video:(it.video === 'ALWAYS' && !!a.v) || (fail && it.video === 'ON_FAIL') || vidDef, vidDef};
}
function missingOf(it, a){
  const m = [];
  if(!a || !a.v) return m;
  if(a.v === 'fail' && !(a.defects || []).length) m.push('เลือกอาการอย่างน้อย 1 อาการ');
  const n = needs(it, a);
  if(n.photo && !(a.photos || []).length) m.push('ถ่ายรูปอย่างน้อย 1 รูป');
  if(n.video && !a.video) m.push('ถ่ายวิดีโอ');
  return m;
}
function itemDone(it, a){
  if(it.type === 'okfail') return !!(a && a.v) && !missingOf(it, a).length;
  if(it.type === 'number') return !!(a && String(a.v || '').trim());
  return !it.required || !!(a && String(a.v || '').trim());
}
const unanswered = I => ITEMS.filter(it => it.required && !itemDone(it, I.ans[it.id]));
/* ออกจากหัวข้อปัจจุบันได้ไหม — ไม่ผ่านแล้วต้องมีหลักฐานครบก่อน (AC FR-QC-04/05/06) */
function leaveBlock(I){
  const it = ITEMS[I.idx], a = I.ans[it.id];
  if(it.type !== 'okfail' || !a || !a.v) return '';
  const m = missingOf(it, a);
  return m.length ? 'หัวข้อ ' + it.id + ': ' + m.join(' และ ') + ' ก่อนไปหัวข้ออื่น' : '';
}

/* =====================================================================
   มือถือ: S07 สรุปผลเครื่อง + Rework/Reject · S08 ตัวตรวจ Rework
   ===================================================================== */
/* BR-04 ผลรายเครื่อง */
function evalResult(ans){
  const failed = ITEMS.filter(it => it.type === 'okfail' && ans[it.id] && ans[it.id].v === 'fail');
  const defs = failed.flatMap(it => (ans[it.id].defects || []).map(c => DEF[c]));
  if(!failed.length) return {res:'PASS', failed, defs};
  if(defs.every(d => d.disp === 'CONCESSION')) return {res:'CONCESSION', failed, defs};
  const hasRej = defs.some(d => d.disp === 'REJECT'), hasRw = defs.some(d => d.disp === 'REWORK');
  const forced = defs.filter(d => d.disp === 'REJECT' && d.sev === 'Critical');
  return {res:'NOT_PASSED', failed, defs, suggest:hasRej ? 'REJECT' : hasRw ? 'REWORK' : null, forced};
}
const RES_TXT = {PASS:'ผ่าน', CONCESSION:'อนุโลม (นับเป็นผ่าน)', NOT_PASSED:'ไม่ผ่าน'};

function scrS07(){
  const I = S.insp, j = jobBy(I.job), r = evalResult(I.ans), miss = unanswered(I);
  const sm = I.sum;
  if(r.res !== 'NOT_PASSED' || (r.forced.length && sm.decision === 'REWORK')) sm.decision = null;
  let why = '';
  if(r.res === 'PASS') why = 'ทุกหัวข้อ "ปกติ"';
  else if(r.res === 'CONCESSION') why = 'อาการที่พบเป็น "อนุโลม" ทั้งหมด (PM/การตลาดอนุมัติไว้ล่วงหน้า) — นับเป็นผ่านในการปิดแผน แต่แสดงแยกใน Report';
  else why = 'มีอาการที่ Disposition = ' + [...new Set(r.defs.filter(d => d.disp !== 'CONCESSION').map(d => DISP[d.disp]))].join(' / ');
  const failList = r.failed.map(it => { const a = I.ans[it.id];
    return `<div><span><b>${it.id}. ${it.title}</b><br>${(a.defects || []).map(c => { const d = DEF[c];
      return `${d.n} <span class="tag">${d.sev}</span> <span class="tag${d.disp === 'CONCESSION' ? ' dash' : ''}">${DISP[d.disp]}</span>`; }).join('<br>')}</span>
      <span class="small muted" style="text-align:right">รูป ${(a.photos || []).length}${a.video ? '<br>วิดีโอ 1' : ''}</span></div>`; }).join('');
  const okCount = ITEMS.filter(it => it.type === 'okfail' && I.ans[it.id] && I.ans[it.id].v === 'ok').length;
  const num = I.ans[11] && I.ans[11].v;
  let decide = '';
  if(r.res === 'NOT_PASSED'){
    const forced = r.forced.length > 0;
    const sug = forced ? 'REJECT' : r.suggest;
    const ch = (k, title, desc) => {
      const off = forced && k === 'REWORK';
      return `<button class="choice${sm.decision === k ? ' on' : ''}${off ? ' off' : ''}" data-act="${off ? 'stub' : 'decide'}" data-v="${k}" ${off ? `data-msg="อาการ Critical ต้องคัดออก — เปลี่ยนเป็น Rework ได้เฉพาะ QC Head พร้อมเหตุผล (B5)"` : ''}>
        <span class="r"></span><b>${title}</b>${sug === k ? ' <span class="tag solid">ระบบเสนอ</span>' : ''}<br><span class="small muted">${desc}</span></button>`; };
    decide = `<h3>เลือกการจัดการเครื่องนี้</h3>
      ${ch('REWORK', 'ส่งซ่อม (Rework)', 'แก้ได้ — สร้างใบ Rework เฉพาะหัวข้อที่ไม่ผ่าน')}
      ${ch('REJECT', 'คัดออก (Reject)', 'แก้ไม่ได้ เช่น ไม่มีอะไหล่ — นับเป็นตรวจแล้ว ไม่มีขั้นตอนต่อ')}
      ${forced ? `<div class="alert">อาการ Critical: ${r.forced.map(d => d.n).join(', ')} → บังคับคัดออก (เปลี่ยนได้เฉพาะ QC Head + เหตุผล)</div>` : ''}
      ${!sug ? '<div class="alert soft">อาการทั้งหมดเป็น "ผู้ตรวจเลือก" — ระบบไม่เสนอ ให้ผู้ตรวจตัดสินเอง</div>' : ''}
      ${sm.decision && sug && sm.decision !== sug ? '<div class="alert soft">เลือกต่างจากที่ระบบเสนอ — ระบบบันทึกไว้ให้หัวหน้าเห็น</div>' : ''}`;
  }
  const blockers = [];
  if(miss.length) blockers.push('ยังตอบไม่ครบ ' + miss.length + ' หัวข้อ');
  if(r.res === 'NOT_PASSED' && !sm.decision) blockers.push('เลือก Rework หรือ Reject');
  if(!sm.me) blockers.push('ยืนยันชื่อผู้ตรวจ');
  const body = `
    ${miss.length ? `<div class="alert"><b>ยังไม่ตอบ:</b> ${miss.map(it => `<button class="btn sm" data-act="jump" data-i="${ITEMS.indexOf(it)}" style="margin:2px">หัวข้อ ${it.id}</button>`).join('')}<br><span class="small">ปุ่ม "ส่ง" ใช้ได้เมื่อตอบครบทุกหัวข้อบังคับ</span></div>` : ''}
    <div class="result${r.res === 'NOT_PASSED' ? ' np' : ''}"><div class="small">${miss.length ? 'ผลเบื้องต้น (ยังตอบไม่ครบ)' : 'ผลเครื่อง (คำนวณตาม BR-04)'}</div>
      <div class="big">${RES_TXT[r.res]}</div><div class="small">${esc(why)}</div></div>
    <div class="card"><div class="row between"><b>หัวข้อไม่ผ่าน (${r.failed.length})</b><span class="small muted">ปกติ ${okCount} หัวข้อ</span></div>
      <div class="lines">${failList || '<div class="muted">—</div>'}</div>
      ${num ? `<div class="small muted mt">แรงดันตัดที่อ่านได้ ${esc(num)} bar (ข้อมูลประกอบ)</div>` : ''}
      <button class="btn sm mt" data-act="jump" data-i="0">กลับไปแก้คำตอบ</button></div>
    ${decide}
    <label class="card row" style="cursor:pointer"><input type="checkbox" id="f_sum_me" data-bind="insp.sum.me" ${sm.me ? 'checked' : ''} style="width:22px;height:22px">
      <span class="grow">ยืนยันว่าผู้ตรวจคือ <b>${S.me.name}</b> (รหัส ${S.me.code})<br><span class="small muted">แสดงบนเครื่องส่วนกลาง (FR-AUTH-05) · ไม่ต้องลงลายเซ็น</span></span></label>
    ${note('BR-04: ผลไม่คิดเป็นเปอร์เซ็นต์ — ดูจากชนิด Disposition เท่านั้น · ระบบเสนอ Reject ถ้ามีอาการ Reject, เสนอ Rework ถ้ามีอาการ Rework, ถ้ามีแต่ "ผู้ตรวจเลือก" จะไม่เสนอ · Critical + Reject = บังคับคัดออก (B5 รอยืนยัน) · ส่งแล้วผลล็อกที่ผู้ตรวจ (FR-QC-12)')}`;
  const foot = `<button class="btn pri block lg${dis(blockers.length, blockers.join(' · '))}" data-act="submitUnit">ส่งผลเครื่องนี้</button>
    ${blockers.length ? `<div class="msg center">ยังส่งไม่ได้: ${esc(blockers.join(' · '))}</div>` : ''}`;
  return {bar:appbar('สรุปผล ' + I.sn, `${j.plan} · ${j.model}`, backBtn('jump', `data-i="${I.idx}"`)), body, foot};
}

/* ---------- S08 ตัวตรวจ Rework (BR-06) ---------- */
function rwState(r){
  if(!S.rw || S.rw.id !== r.id){
    const st = {};
    r.items.forEach(x => { st[x.id] = {fix:{}, other:{}, photos:[], video:null, re:''}; });
    S.rw = {id:r.id, st, decision:null};
  }
  return S.rw;
}
const rwNeedsVideo = (x) => { const it = itemById(x.id); return it.video !== 'NONE' || x.defects.some(c => DEF[c].vid); };
function rwMissing(r){
  const R = S.rw, m = [];
  r.items.forEach(x => { const s = R.st[x.id];
    if(x.defects.some(c => !s.fix[c] || (s.fix[c] === 'อื่นๆ' && !String(s.other[c] || '').trim()))) m.push(`หัวข้อ ${x.id}: เลือกวิธีแก้`);
    if(!s.photos.length) m.push(`หัวข้อ ${x.id}: รูปหลังแก้`);
    if(rwNeedsVideo(x) && !s.video) m.push(`หัวข้อ ${x.id}: วิดีโอ`);
    if(!s.re) m.push(`หัวข้อ ${x.id}: ประเมินใหม่`);
  });
  const anyFail = r.items.some(x => R.st[x.id].re === 'fail');
  if(anyFail && !R.decision) m.push('เลือก Rework รอบถัดไป หรือ Reject');
  return m;
}
function scrS08(){
  const r = rwBy(S.rw && S.rw.id) || S.reworks[0];
  if(!r) return {bar:appbar('ตัวตรวจ Rework', '', backBtn('nav', 'data-s="S04"')), body:'<div class="card dash center"><p>ไม่มี Rework ค้าง</p><p class="small muted">กด "เริ่มใหม่ทั้งหมด" ในแผงซ้ายเพื่อคืนข้อมูลตัวอย่าง</p></div>', tabs:true};
  const R = rwState(r), j = jobBy(r.job);
  const anyFail = r.items.some(x => R.st[x.id].re === 'fail');
  const cards = r.items.map(x => { const it = itemById(x.id), s = R.st[x.id];
    const fixes = x.defects.map(c => `<div class="field"><span class="flabel req">วิธีแก้ — ${DEF[c].n}</span>
      <div class="seg">${FIX_METHODS.map(mth => `<button data-act="fix" data-item="${x.id}" data-c="${c}" data-v="${mth}" class="${s.fix[c] === mth ? 'on' : ''}">${mth}</button>`).join('')}</div>
      ${s.fix[c] === 'อื่นๆ' ? `<input class="inp mt" id="f_oth_${x.id}_${c}" data-bind="rw.st.${x.id}.other.${c}" value="${esc(s.other[c] || '')}" placeholder="ระบุวิธีแก้">` : ''}</div>`).join('');
    return `<div class="card strong">
      <h3 style="margin-top:0">หัวข้อ ${it.id}. ${it.title}</h3>
      <div class="hist"><div class="small"><b>รอบ ${r.round - 1} พบ</b> (${r.src === 'QA' ? 'โดย QA' : 'โดย QC'} · อ่านอย่างเดียว ห้ามแก้)</div>
        <div class="chips mt">${x.defects.map(c => `<span class="chip">${DEF[c].n}</span>`).join('')}</div>
        <div class="thumbs">${Array.from({length:x.photos}, (_, i) => `<div class="thumb ph-img"><span class="wmk">รอบ ${r.round - 1}<br>รูป ${i + 1}</span></div>`).join('')}</div></div>
      ${fixes}
      <div class="field"><span class="flabel req">รูปหลังแก้ (${s.photos.length}/1 ขั้นต่ำ)</span>
        <div class="thumbs">${s.photos.map(p => `<div class="thumb ph-img"><span class="wmk">${r.sn}<br>${p.t}</span></div>`).join('')}</div>
        <button class="btn block${s.photos.length ? '' : ' pri'}" data-act="cam" data-m="photo" data-rw="${x.id}">${s.photos.length ? 'ถ่ายเพิ่ม / ลบรูป' : 'ถ่ายรูปหลังแก้'}</button></div>
      ${rwNeedsVideo(x) ? `<div class="field"><span class="flabel req">วิดีโอหลังแก้ ≤ 20 วิ</span><div class="small muted">ตามกติกาเดียวกับตอนตรวจ (อาการ/หัวข้อนี้ต้องมีวิดีโอ)</div>
        ${s.video ? `<div class="thumbs"><div class="thumb ph-img vid"><span class="wmk">${s.video.dur} วิ</span></div></div>` : ''}
        <button class="btn block${s.video ? '' : ' pri'}" data-act="cam" data-m="video" data-rw="${x.id}">${s.video ? 'ถ่ายวิดีโอใหม่' : 'ถ่ายวิดีโอ'}</button></div>` : ''}
      <div class="field"><span class="flabel req">ประเมินหัวข้อนี้ใหม่</span>
        <div class="ans" style="margin:0"><button class="btn${s.re === 'ok' ? ' sel' : ''}" data-act="reEval" data-item="${x.id}" data-v="ok">✓ ปกติ</button>
        <button class="btn${s.re === 'fail' ? ' sel' : ''}" data-act="reEval" data-item="${x.id}" data-v="fail">✕ ยังไม่ผ่าน</button></div></div>
    </div>`; }).join('');
  const dec = anyFail ? `<h3>ยังไม่ผ่าน — เลือกการจัดการ</h3>
    <button class="choice${R.decision === 'REWORK' ? ' on' : ''}" data-act="rwDecide" data-v="REWORK"><span class="r"></span><b>ส่งซ่อมอีกรอบ (Rework รอบ ${r.round + 1})</b></button>
    <button class="choice${R.decision === 'REJECT' ? ' on' : ''}" data-act="rwDecide" data-v="REJECT"><span class="r"></span><b>คัดออก (Reject)</b><br><span class="small muted">แก้ไม่ได้${r.src === 'QA' ? ' — ผล QA ของเครื่องนี้ = QA_REPLACED และ QA ต้องสุ่มเครื่องอื่นแทน' : ''}</span></button>` : '';
  const miss = rwMissing(r);
  const body = `
    <div class="card dash"><dl class="kv"><dt>แหล่งที่มา</dt><dd><b>${r.src === 'QA' ? 'QA ไม่รับเครื่องนี้' : 'QC ตรวจไม่ผ่าน'}</b> · ${r.by} · ${r.at}</dd>
      <dt>แผน</dt><dd>${j.plan} · ${j.model}</dd><dt>รอบนี้</dt><dd>รอบ ${r.round} · ตรวจเฉพาะ ${r.items.length} จาก ${ITEMS.length} หัวข้อที่ไม่ผ่าน</dd></dl>
      ${r.src === 'QA' ? '<div class="small mt">ส่งแล้วเครื่องนี้กลับเข้าคิว QA "รอตรวจซ้ำ" (ไม่ต้องผ่านหัวหน้าตรวจทานอีก)</div>' : ''}</div>
    <div class="row between small"><span>${syncLine()}</span></div>

function formCalc(){
  const F = S.form, lot = Math.floor(+String(F.lot).replace(/,/g, '') || 0);
  const m = modelBy(F.model);
  const docKey = F.origin === 'IMP' ? 'INV|' + norm(F.docNo) + '|' + F.vendor : 'PO|' + norm(F.docNo) + '|' + F.dept;
  const doc = F.origin === 'IMP' && F.vendor && norm(F.docNo) ? DOCS[docKey] : null;
  const docPlans = doc ? S.plans.filter(p => norm(p.doc) === norm(F.docNo) && p.vendor === F.vendor && p.st !== 'CANCELLED') : [];
  const dup = m && doc ? docPlans.find(p => p.model === m.code) : null;
  const level = F.aql || defaultAql(F.origin);
  const aq = aqlLookup(level, lot), aqDef = aqlLookup(defaultAql(F.origin), lot);
  const invDate = doc ? doc.date : F.docDate;
  const dl = F.origin === 'IMP' ? deadlineInfo(invDate) : null;
  const miss = [];
  if(F.origin === 'IMP'){ if(!F.vendor) miss.push('Vendor'); if(!norm(F.docNo)) miss.push('เลข Invoice');
    if(!doc && !parseD(F.docDate)) miss.push('วันที่ Invoice'); if(!doc && !(+F.sku > 0)) miss.push('จำนวน SKU'); }
  else { if(!norm(F.docNo)) miss.push('เลข PO'); }
  if(!m) miss.push('Model'); if(!(lot > 0)) miss.push('จำนวนตาม Invoice/PO');
  if(F.aql && F.aql !== defaultAql(F.origin) && !F.aqlReason.trim()) miss.push('เหตุผลที่เปลี่ยนระดับ AQL');
  if(dup) miss.push('แผนซ้ำ');
  return {lot, m, doc, docPlans, dup, level, aq, aqDef, dl, miss, qc:qcRequired(lot)};
}

function presetInsp(failItem, defect){

      if(j) j.assigned = +r.qty;
      else { const m = modelBy(p.model) || {}; S.jobs.push({id:'J' + (S.jobs.length + 1), plan:p.plan, doc:p.doc, vendor:p.vendor, model:p.model, desc:m.desc || '', cl:m.qc || '', lot:p.lot, assigned:+r.qty, done:0, status:'WAITING', serials:[]}); } });
    logH(p, headName(), `มอบหมาย ${a.rows.map(r => r.name.replace('ผู้ตรวจ ', '') + '.' + r.qty).join(' / ')} (รวม ${sum}/${req})${over > 0 ? ` · มอบเกิน ${over}: ${a.reason.trim()}` : ''}${before ? '' : ' · สถานะ: → มอบหมายแล้ว'}`, 'dec');
    S.asg = null; S.cur.plan = p.plan; S.cur.tab = 'jobs'; S.screen = 'S12'; S._top = true;
    toast(`บันทึกการมอบหมายแล้ว · รวม ${sum} / ต้องตรวจ ${req}${over > 0 ? ` · มอบเกิน ${over} พร้อมเหตุผล` : ''} · แจ้งผู้ตรวจที่เกี่ยวข้อง`);
  },
  revToggle(d){ S.rev.sel[d.sn] = !S.rev.sel[d.sn]; },
  revEdit(d){ const u = unitsOf(planBy(S.rev.plan)).find(x => x.sn === d.sn); S.rev.edit = {sn:d.sn, from:u.r1[0], to:'', reason:''}; },
  revCancelEdit(){ S.rev.edit = null; },
  revSave(){
    const p = planBy(S.rev.plan), e = S.rev.edit, u = unitsOf(p).find(x => x.sn === e.sn), o = DEF[e.from], n = DEF[e.to];
    u.r1 = u.r1.map(c => c === e.from ? e.to : c);
    u.revs.push({n:u.revs.length + 1, by:headName(), at:NOW_TXT, from:e.from, to:e.to, reason:e.reason.trim()});
    logH(p, headName(), `Correction ${u.sn} ฉบับที่ ${u.revs.length}: "${o.n}" → "${n.n}" · เหตุผล: ${e.reason.trim()}`, 'corr');
    S.rev.edit = null;
    toast(`แก้ ${u.sn} แล้ว: ${n.n} +1, ${o.n} −1 · แสดงป้าย "แก้โดย ${headName()} (เดิม: ${o.n})" · ข้อมูลรอบ Rework ไม่เปลี่ยน · Audit เก็บค่าเดิม→ใหม่`);
  },
  revReturn(){
    const p = planBy(S.rev.plan), us = unitsOf(p).filter(u => S.rev.sel[u.sn]), due = fmtD(nextWorkday(TODAY));
    us.forEach(u => { u.ret = {by:headName(), at:NOW_TXT, comment:S.rev.comment.trim(), due, done:false}; });
    p.st = 'QC_IN_PROGRESS';
    logH(p, headName(), `ตีกลับ ${us.map(u => u.sn).join(', ')} ให้ผู้ตรวจแก้ · กำหนดแก้ ${due} · ความเห็น: ${S.rev.comment.trim()} · สถานะ: → กำลังตรวจ`, 'dec');
    S.rev.sel = {}; S.rev.comment = '';
    toast(`ตีกลับ ${us.length} เครื่องแล้ว · ผู้ตรวจได้แจ้งเตือน เปิด Checklist เดิมพร้อมคำตอบเดิม แก้ได้เฉพาะเครื่องนั้น · กำหนดแก้ ${due}`);
  },
  revSimDone(){
    const p = planBy(S.rev.plan), us = unitsOf(p).filter(u => u.ret && !u.ret.done);
    us.forEach(u => { u.ret.done = true; });
    p.st = 'QC_REVIEW'; logH(p, us[0] ? us[0].insp : 'ผู้ตรวจ', `แก้ ${us.map(u => u.sn).join(', ')} ตามที่ตีกลับแล้ว ส่งใหม่ · สถานะ: → รอหัวหน้าตรวจทาน`);
    toast('ผู้ตรวจส่งแล้ว — Report กลับเข้า "รอตรวจทาน"');
  },
  revSend(){ const p = planBy(S.rev.plan); p.st = 'QA_PENDING'; logH(p, headName(), 'ตรวจทานผล QC เสร็จ ส่ง QA · สถานะ: → รอ QA'); toast(`ส่ง ${p.plan} ให้ QA แล้ว · สถานะ: รอ QA${(modelBy(p.model) || {}).origin === 'DOM' ? '' : ' · ร่าง Report QC พร้อมรออนุมัติ'}`); },
  revApprove(){ const p = planBy(S.rev.plan); p.st = 'COMPLETED'; logH(p, headName(), 'อนุมัติ Report QC + QA · ล็อก + PDF snapshot · สถานะ: → เสร็จ'); toast('อนุมัติแล้ว — Report ถูกล็อก มี PDF snapshot'); },
  revReopen(){ const p = planBy(S.rev.plan); p.st = 'REPORT_REVIEW'; logH(p, headName(), 'เปิดใหม่ · เหตุผล: ' + S.rev.reopen.trim() + ' · สถานะ: → รออนุมัติ Report'); S.rev.reopen = ''; toast('เปิด Report ใหม่แล้ว (เวอร์ชันใหม่)'); }
});

/* ---------- render ---------- */
let lastScreen = null;
function render(keepFocus){
  const ae = document.activeElement;
  let foc = null;
  if(keepFocus && ae && ae.id && ae.matches('input,textarea,select')){ foc = {id:ae.id}; try{ foc.s = ae.selectionStart; foc.e = ae.selectionEnd; }catch(e){} }
  const sc = {};
  ['phbody', 'lapbody'].forEach(id => { const el = document.getElementById(id); if(el) sc[id] = el.scrollTop; });
  const sh = document.querySelector('.sh-body'); const shTop = sh ? sh.scrollTop : 0;
  document.body.classList.toggle('nonotes', !S.notes);
  ensure(S.screen);
  const def = SCREENS[S.screen];
  document.getElementById('nav').innerHTML = navHtml();
  document.getElementById('wfTitle').textContent = 'WIREFRAME · ' + S.screen + ' ' + def.name;
  document.getElementById('stage').innerHTML = def.dev === 'm' ? phoneFrame(def.fn()) : def.fn();
  if(lastScreen === S.screen && !S._top){
    ['phbody', 'lapbody'].forEach(id => { const el = document.getElementById(id); if(el && sc[id] != null) el.scrollTop = sc[id]; });
  }
  const sh2 = document.querySelector('.sh-body'); if(sh2 && sh) sh2.scrollTop = shTop;
  S._top = false; lastScreen = S.screen;
  if(foc){ const el = document.getElementById(foc.id); if(el){ el.focus({preventScroll:true}); try{ if(foc.s != null) el.setSelectionRange(foc.s, foc.e); }catch(e){} } }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  if(el.dataset.self && e.target !== el) return;
  e.preventDefault();
  if(el.classList.contains('is-disabled')){ toast(el.dataset.why || 'ยังทำไม่ได้'); render(); return; }
  const f = A[el.dataset.act];
  if(!f) return;
  f(el.dataset, el);
  if(el.dataset.act !== 'toggleNav') render();
});
function onBind(e){
  const el = e.target, path = el.dataset && el.dataset.bind;
  if(!path) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if(path === 'pw') v = +v;
  const ks = path.split('.');
  let o = S;
  for(let i = 0; i < ks.length - 1; i++){ if(o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; }
  o[ks[ks.length - 1]] = v;
  if(path === 'scan.sn') S.scan.method = 'MANUAL';
  if(path === 'offline' && !v) scheduleSync();
  if(path === 'form.aql' && v === defaultAql(S.form.origin)) S.form.aql = '';
  render(true);
}
document.addEventListener('input', e => { if(e.target.matches('input[type=text],input:not([type]),textarea')) onBind(e); });
document.addEventListener('change', e => { if(e.target.matches('select,input[type=checkbox]')) onBind(e); });
document.addEventListener('keydown', e => {
  if(S.screen !== 'S06' || S.sheet || S.cam || S.drawer || !S.insp) return;
  if(e.target.matches('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const act = k === 'p' ? ['answer', {v:'ok'}] : k === 'f' ? ['answer', {v:'fail'}] : e.key === 'ArrowRight' ? ['go', {d:'1'}] : e.key === 'ArrowLeft' ? ['go', {d:'-1'}] : null;
  if(!act) return;
  e.preventDefault();
  A[act[0]](act[1]);
  render();
});
let rsT = null;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => render(true), 120); });
render();
</script>
